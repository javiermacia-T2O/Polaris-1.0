name: Build Polaris portable

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polaris-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows portable ZIP
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          uv sync --all-groups --frozen
          npm ci

      - name: Verify frontend and data contracts
        shell: pwsh
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
          uv run pytest -q --no-header --basetemp=.pytest_tmp -p no:cacheprovider --ignore=MedicionAgil_Light/tests/test_light_geox_layout.py

      - name: Verify native host
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build portable distribution
        shell: pwsh
        run: .\scripts\build_portable_release.ps1 -Clean

      - name: Smoke-test frozen sidecar
        shell: pwsh
        run: uv run python scripts\smoke_sidecar.py release\Polaris\medicion-sidecar.exe

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Polaris-Windows-portable
          path: release/Polaris-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = (Get-ChildItem release\Polaris-*.zip | Select-Object -First 1).FullName
          $tag = "polaris-fase4-latest"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --title "Polaris Fase 4 - portable" --notes "Distribución portable de Windows validada automáticamente. Descomprime el ZIP y ejecuta Polaris.exe; no requiere instalar Python ni muestra una consola durante el arranque."
          }
