[package]
name = "medicion-agil"
version = "0.1.0"
description = "Medición Ágil desktop shell"
authors = ["Medición Ágil"]
edition = "2021"

[lib]
name = "medicion_agil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Without this feature Tauri keeps pointing the webview at `build.devUrl`
# (http://localhost:1420) even in a release build, so the packaged app would
# never load the embedded frontend. `tauri build` enables it automatically;
# a plain `cargo build --release` must pass `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rand = "0.9.2"
rfd = "0.15.4"
thiserror = "2.0.17"
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
] }
