[package]
name = "medicion-agil"
version = "0.1.0"
description = "Medición Ágil desktop shell"
authors = ["Medición Ágil"]
edition = "2021"

[lib]
name = "medicion_agil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rand = "0.9.2"
rfd = "0.15.4"
thiserror = "2.0.17"
