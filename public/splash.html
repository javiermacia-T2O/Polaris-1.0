<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris</title>
    <style>
      /* The splash is a plain HTML document: no React, no bundler, no
         network. It paints the first frame from the inline styles below so
         there is never a white or blue flash before the window appears. */
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #0b1f3a; color: #e8f1fb;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        user-select: none; cursor: default;
      }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 24px;
        background: radial-gradient(120% 120% at 50% 0%, #16375f 0%, #0b1f3a 62%);
      }
      .mark { width: 88px; height: 88px; opacity: .96; animation: float 3.4s ease-in-out infinite; }
      .title {
        font-family: "Bodoni MT", "Bodoni 72", Didot, "Times New Roman", serif;
        font-size: 38px; letter-spacing: 7px; text-transform: uppercase;
        color: #fff; margin: 0;
      }
      .sub { margin: -12px 0 0; font-size: 10.5px; letter-spacing: 3.4px;
        text-transform: uppercase; color: #7fa9d8; }
      .bar { width: 232px; height: 3px; border-radius: 999px; background: #1d3f68; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 34%; border-radius: 999px;
        background: linear-gradient(90deg, #5aa2e0, #8fc4f2);
        animation: slide 1.5s ease-in-out infinite; }
      .msg { min-height: 16px; font-size: 11.5px; color: #9dc0e6; letter-spacing: .3px; }
      .steps { display: flex; gap: 8px; margin-top: 2px; }
      .steps span { width: 6px; height: 6px; border-radius: 50%; background: #24486f; transition: background .3s ease; }
      .steps span.done { background: #5aa2e0; }
      .steps span.active { background: #8fc4f2; box-shadow: 0 0 8px #8fc4f2; }
      #failure { display: none; flex-direction: column; align-items: center; gap: 14px; max-width: 340px; text-align: center; }
      #failure h2 { margin: 0; font-size: 15px; font-weight: 600; color: #ffd9d9; }
      #failure p { margin: 0; font-size: 11.5px; color: #c9a9a9; line-height: 1.5; }
      .actions { display: flex; gap: 10px; margin-top: 4px; }
      button {
        font: inherit; font-size: 11.5px; padding: 7px 16px; border-radius: 7px;
        cursor: pointer; color: #e8f1fb;
        background: #1d3f68; border: 1px solid #2c5a8c; transition: background .2s ease;
      }
      button:hover { background: #27507f; }
      button.primary { background: #2f6fb0; border-color: #3f86cf; }
      button.primary:hover { background: #3a7fc4; }
      #details { display: none; margin-top: 6px; font-size: 10.5px; color: #8fb0d4;
        background: #0e2743; border: 1px solid #1d3f68; border-radius: 7px;
        padding: 8px 10px; max-width: 320px; word-break: break-word; text-align: left; }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <img class="mark" src="polaris-logo.png" alt="" />
      <h1 class="title">Polaris</h1>
      <p class="sub">Marketing Science</p>
      <div class="bar"><i></i></div>
      <p class="msg" id="msg">Iniciando Polaris…</p>
      <div class="steps" id="steps">
        <span data-step="engine"></span>
        <span data-step="frontend"></span>
        <span data-step="ready"></span>
      </div>
      <div id="failure">
        <h2>No se pudo iniciar el motor local.</h2>
        <p id="failure-msg">Polaris no pudo preparar el servicio de análisis.</p>
        <div class="actions">
          <button class="primary" id="retry">Reintentar</button>
          <button id="details-toggle">Ver detalles</button>
          <button id="quit">Salir</button>
        </div>
        <pre id="details"></pre>
      </div>
    </div>
    <script>
      // The splash talks to Rust through the global Tauri bridge, so it needs
      // no bundler and no npm dependency. Every milestone below is a real
      // event emitted by the StartupCoordinator; nothing advances on a timer.
      (function () {
        var tauri = window.__TAURI__;
        var invoke = tauri && tauri.core && tauri.core.invoke;
        var listen = tauri && tauri.event && tauri.event.listen;
        var msg = document.getElementById("msg");
        var failure = document.getElementById("failure");
        var failureMsg = document.getElementById("failure-msg");
        var details = document.getElementById("details");
        var steps = document.getElementById("steps");

        function markStep(name, state) {
          var dot = steps.querySelector('[data-step="' + name + '"]');
          if (dot) dot.className = state;
        }

        function showFailure(message) {
          document.querySelector(".bar").style.display = "none";
          steps.style.display = "none";
          msg.style.display = "none";
          failure.style.display = "flex";
          failureMsg.textContent = message || "Polaris no pudo preparar el servicio de análisis.";
          details.textContent = message || "";
        }

        if (!invoke) {
          // Without the bridge there is nothing to coordinate; keep the
          // splash honest instead of pretending to progress.
          showFailure("No se pudo conectar con el proceso principal.");
          return;
        }

        // Tell Rust the splash painted, so the coordinator records the first
        // real milestone.
        invoke("splash_ready").catch(function () {});

        if (listen) {
          listen("startup://stage", function (event) {
            var payload = event.payload || {};
            if (payload.message) msg.textContent = payload.message;
            if (payload.stage === "engine_starting") markStep("engine", "active");
            if (payload.stage === "engine_ready") markStep("engine", "done");
            if (payload.stage === "frontend_ready") markStep("frontend", "done");
            if (payload.stage === "ready") markStep("ready", "done");
          });
          listen("startup://failed", function (event) {
            showFailure((event.payload || {}).message);
          });
        }

        document.getElementById("retry").addEventListener("click", function () {
          failure.style.display = "none";
          document.querySelector(".bar").style.display = "block";
          steps.style.display = "flex";
          msg.style.display = "block";
          msg.textContent = "Reintentando…";
          markStep("engine", "active");
          markStep("frontend", "");
          markStep("ready", "");
          invoke("retry_startup").catch(function () {});
        });
        document.getElementById("details-toggle").addEventListener("click", function () {
          details.style.display = details.style.display === "block" ? "none" : "block";
        });
        document.getElementById("quit").addEventListener("click", function () {
          invoke("quit_app").catch(function () {});
        });
      })();
    </script>
  </body>
</html>
