[project]
name = "medicion-agil"
version = "0.1.0"
description = "Motor local de datos y analítica para Medición Ágil"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==1.5.5",
  "matplotlib==3.11.2",
  "meridian-geox==1.0.1",
  "numpy==2.5.3",
  "openpyxl==3.1.5",
  "pandas==3.0.6",
  "polars==1.44.2",
  "pyarrow==25.0.1",
  "pycausalimpact==0.1.1",
  "pydantic==2.13.5",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
]

[dependency-groups]
dev = [
  "pyinstaller==6.22.3",
  "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src-tauri/sidecar-source/tests"]
pythonpath = [
  "src-tauri/sidecar-source",
  "src-tauri/sidecar-source/mmm_app",
  "src-tauri/sidecar-source/python",
]
addopts = "-ra"
